name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -count=1 ./...

      - name: build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build -o /dev/null .

  # Images real block devices under concurrent writes and checks the
  # restored images byte-for-byte. Two kernels, because blktrace changed:
  # 22.04 runs 6.8 (blktrace protocol v1), 24.04 runs 7.0 (protocol v2;
  # since 6.19 a v1 session silently drops FUA and write-zeroes events).
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: build
        run: go build -o hot-clone .

      - name: install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq blktrace dmsetup

      - name: end-to-end tests
        run: sudo bash test/e2e.sh ./hot-clone
